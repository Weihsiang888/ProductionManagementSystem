<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Simple i18n Test</title>
</head>
<body>
    <h1>i18n System Test</h1>
    <div id="status">Loading...</div>
    <div id="lang">Current Language: </div>
    <div id="test1">Test 1: <span data-i18n="app.title">Loading...</span></div>
    <div id="test2">Test 2: <span data-i18n="nav.home">Loading...</span></div>
    <div id="lang-switcher" style="margin: 20px 0;"></div>
    <button onclick="testTranslation()">Test t() function</button>
    <div id="output"></div>

    <script src="js/i18n/config.js"></script>
    <script src="js/i18n/languageSwitcher.js"></script>
    <script src="js/i18n/translationUpdater.js"></script>
    
    <script>
        window.addEventListener('i18nReady', () => {
            document.getElementById('status').textContent = 'i18n Ready!';
            document.getElementById('lang').textContent = 'Current Language: ' + window.i18n.getCurrentLanguage();
            
            // Render language switcher
            const container = document.getElementById('lang-switcher');
            container.id = 'language-switcher-container';
            window.languageSwitcher.render('language-switcher-container');
        });
        
        function testTranslation() {
            const output = document.getElementById('output');
            output.innerHTML = '<h3>Translation Test Results:</h3>';
            output.innerHTML += '<p>app.title: ' + window.i18n.t('app.title') + '</p>';
            output.innerHTML += '<p>nav.home: ' + window.i18n.t('nav.home') + '</p>';
            output.innerHTML += '<p>nav.esop: ' + window.i18n.t('nav.esop') + '</p>';
            output.innerHTML += '<p>home.title: ' + window.i18n.t('home.title') + '</p>';
        }
    </script>
</body>
</html>
